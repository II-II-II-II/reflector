<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reflector{% endblock %} — Reflector</title>
  <style>
    :root {
      --bg: #fafafa; --surface: #fff; --text: #1c1c1e; --text-dim: #666;
      --border: #e2e2e5; --accent: #2c5cc5; --accent-dim: #eef2fc;
      --crisis-bg: #fdecea; --crisis-border: #f5c2c0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214; --surface: #1c1c1f; --text: #f0f0f2; --text-dim: #9a9aa2;
        --border: #303035; --accent: #6f97e6; --accent-dim: #1c2740;
        --crisis-bg: #3a1f1e; --crisis-border: #6e3230;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif; max-width: 700px; margin: 0 auto;
      padding: 0 1.25rem 3rem; color: var(--text); background: var(--bg); line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    header.site {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 1.1rem 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    header.site a.wordmark { font-size: 1.15rem; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.01em; }
    header.site nav a { color: var(--accent); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
    h1 { font-size: 1.35rem; }
    .instrument-list a {
      display: block; padding: 0.85rem 1rem; margin-bottom: 0.6rem; border: 1px solid var(--border);
      border-radius: 10px; text-decoration: none; color: var(--text); background: var(--surface);
    }
    .instrument-list a:active { background: var(--accent-dim); }
    .item { margin-bottom: 1.75rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
    .item p { margin: 0 0 0.7rem 0; }
    .scale { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .scale label {
      display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem;
      border: 1px solid var(--border); border-radius: 20px; padding: 0.55rem 0.9rem;
      background: var(--surface); cursor: pointer; user-select: none;
    }
    .scale input[type="radio"] { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; }
    .scale label:has(input:checked) { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    button, input[type="submit"] {
      background: var(--accent); color: white; border: none; padding: 0.85rem 1.5rem;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%;
    }
    button:active { opacity: 0.85; }
    textarea, input[type="text"] {
      font-size: 1rem; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    }
    .error { color: #d64541; }
    .severity { font-size: 1.2rem; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; }
    td, th { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); text-align: left; }
    .crisis { background: var(--crisis-bg); border: 1px solid var(--crisis-border); padding: 1.2rem; border-radius: 10px; }
    a.back { display: inline-block; margin-top: 1.5rem; color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header class="site">
    <a class="wordmark" href="{{ url_for('index') }}">Reflector</a>
    <nav><a href="{{ url_for('chat_page') }}">Chat</a></nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
