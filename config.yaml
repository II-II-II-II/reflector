# Reflector — model backend configuration.
#
# No secrets belong in this file. Bedrock uses the standard AWS credential
# chain (env vars / ~/.aws/credentials / SSO) — nothing to set here beyond
# region and model ID. Anthropic direct reads its key from the environment
# variable named below, never from this file.

llm:
  # Which backend the chat agent actually calls. Only one active at a time.
  # "anthropic" sends real conversation content to Anthropic's API — this
  # project's stated privacy bar rules that out for anything but throwaway
  # testing with non-real content. Left configurable anyway, disabled by
  # default via the provider value below.
  provider: bedrock  # ollama | bedrock | anthropic

  # Not used for chat (see docs/ROADMAP.md — local tested and rejected for
  # this layer specifically, real quality gap vs. frontier on conversational
  # insight). Kept configured for reflector.extract (Layer 1) and available
  # to swap back into chat for comparison if a better local model shows up.
  ollama:

retrieval:
  weights:
    semantic: 0.5
    recency: 0.2
    salience: 0.2
    emotion: 0.1
  recency_half_life_days: 180
  anniversary_window_days: 3
  anniversary_bonus: 0.15
  notable_bonus: 0.15
  risk_flag_bonus: 0.15
    model: qwen2.5:32b
    host: http://localhost:11434
    num_ctx: 32768  # was 8192, sized for short single-entry extraction — a tool-using chat turn alone can be several thousand tokens

  bedrock:
    # deepseek.v3.2 — ON_DEMAND, no inference-profile routing needed.
    # Claude Sonnet 5 (us.anthropic.claude-sonnet-5) is still pending the
    # Anthropic account-entitlement gate on the AWS side; swap model_id back
    # once that clears — no other code changes needed either way.
    model_id: deepseek.v3.2
    region: us-east-1  # must match the region where model access is granted
    profile: reflector  # named AWS CLI profile; omit to use the default credential chain

  anthropic:
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
